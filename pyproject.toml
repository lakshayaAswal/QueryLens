[project]
name = "querylens-hosted"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2,<3",
    "SQLAlchemy>=2.0,<3",
    "sqlglot>=30.33,<31",
    "PyMySQL[rsa]>=1.2.4,<2",
    "psycopg[binary]>=3.2,<4",
    "google-genai>=1.35,<2",
    "httpx>=0.28,<1",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
]

[tool.vercel]
entrypoint = "hosted:app"

[tool.uv]
package = false
